  <script>
    // Particle background
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let w, h, particles = [];
    function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; init(); }
    window.addEventListener("resize", resize);
    class Particle {
      constructor(){ this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*1.5+0.5; this.speedX = (Math.random()-0.5)*0.2; this.speedY = (Math.random()-0.5)*0.2; this.alpha = Math.random()*0.5+0.1; }
      update(){ this.x += this.speedX; this.y += this.speedY; if(this.x<0)this.x=w; if(this.x>w)this.x=0; if(this.y<0)this.y=h; if(this.y>h)this.y=0; }
      draw(){ ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle=`rgba(139,92,246,${this.alpha})`; ctx.fill(); }
    }
    function init(){ particles = []; for(let i=0; i<Math.floor((w*h)/7000); i++) particles.push(new Particle()); }
    function animate(){ ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
    resize(); animate();
  </script>

    const firebaseConfig = {
      apiKey: "AIzaSyCyrdoBu6tPtfaZM_8s2UpNBNFgbRtHZjM",
      authDomain: "am-gen-thanz.firebaseapp.com",
      projectId: "am-gen-thanz",
      storageBucket: "am-gen-thanz.firebasestorage.app",
      messagingSenderId: "1064875166814",

    window.processLogin = async () => {

    window.processRegister = async () => {

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('-translate-y-20', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 3000);
    }
    function switchAuth(type) {
      document.getElementById('loginPanel').classList.toggle('hidden', type === 'register');
      document.getElementById('registerPanel').classList.toggle('hidden', type === 'login');
    }
    function switchFeature(feature) {
      ['am', 'bulk', 'inbox', 'tt'].forEach(f => {
        document.getElementById('featurePanel' + f.toUpperCase()).classList.toggle('hidden', f !== feature);
        document.getElementById('tabBtn' + f.toUpperCase())?.className = f === feature ? "px-2 py-1 rounded-lg bg-brand text-white text-[10px] font-bold" : "px-2 py-1 rounded-lg bg-surface-card border border-brand/30 text-zinc-400 text-[10px]";
      });
    }
    function toggleSidebar() {
      document.getElementById('sidebarMenu').classList.toggle('-translate-x-full');
      const o = document.getElementById('sidebarOverlay');
      o.classList.toggle('opacity-0'); o.classList.toggle('pointer-events-none');
    }
    function goToStep(s) {
      document.getElementById('progressBar').style.width = (s * 33.33) + '%';
      [1, 2, 3].forEach(p => document.getElementById('panel' + p).classList.toggle('hidden', p !== s));
    }

    let currentTargetEmail = '';
    async function handleSendEmail() {
      const email = document.getElementById('targetEmailInput').value.trim();
      if(!email) return showToast("Masukkan email!");
      try {
        const res = await fetch('/api/alight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send', email })
        });
        const data = await res.json();
        if(res.ok && data.status !== false) {
          currentTargetEmail = email;
          document.getElementById('displayEmail').textContent = email;
          showToast("Magic link terkirim!");
          goToStep(2);
        } else {
          showToast(data.message || "Gagal mengirim.");
        }
      } catch { showToast("Koneksi error."); }
    }

    async function handleVerify() {
      const link = document.getElementById('targetUrlInput').value.trim();
      if(!link) return showToast("Masukkan link!");
      try {
        const res = await fetch('/api/alight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify', email: currentTargetEmail, link })
        });
        const data = await res.json();
        if(res.ok && data.status !== false) {
          showToast("Berhasil di-inject!");
          goToStep(3);
        } else {
          showToast(data.message || "Gagal verifikasi.");
        }
      } catch { showToast("Koneksi error."); }
    }

    function resetApp() { currentTargetEmail = ''; goToStep(1); }

    async function handleBulkGenerate() {
      const amount = document.getElementById('bulkAmountInput').value;
      try {
        const res = await fetch('/api/alight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'bulk', amount })
        });
        const data = await res.json();
        const results = document.getElementById('bulkResultsContainer');
        results.innerHTML = `<pre class="text-[10px] text-zinc-300 p-2 bg-zinc-900 rounded">${JSON.stringify(data, null, 2)}</pre>`;
        results.classList.remove('hidden');
        showToast("Bulk selesai!");
      } catch { showToast("Gagal bulk."); }
    }

    async function handleInboxRead() {
      const email = document.getElementById('inboxEmailInput').value.trim();
      if(!email) return showToast("Masukkan email!");
      try {
        const res = await fetch('/api/alight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'inbox', email })
        });
        const data = await res.json();
        const results = document.getElementById('inboxResultsContainer');
        results.innerHTML = `<pre class="text-[10px] text-zinc-300 p-2 bg-zinc-900 rounded">${JSON.stringify(data, null, 2)}</pre>`;
        results.classList.remove('hidden');
        showToast("Inbox dibaca!");
      } catch { showToast("Gagal baca inbox."); }
    }

    let ttMode = 'auto';
    function setTTMode(m) { ttMode = m; }
    async function handleDownloadTikTok() {
      const url = document.getElementById('ttUrlInput').value.trim();
      if(!url) return showToast("Masukkan link TikTok!");
      try {
        const res = await fetch('https://tikwm.com/api/?url=' + encodeURIComponent(url) + '&hd=1');
        const json = await res.json();
        if(json.code === 0) {
          const c = document.getElementById('ttResultContainer');
          c.innerHTML = `<a href="${json.data.play}" target="_blank" class="block py-2 text-center bg-brand rounded text-white text-xs">Download Video</a>`;
          c.classList.remove('hidden');
          showToast("Berhasil!");
        } else {
          showToast("Gagal unduh TikTok.");
        }
      } catch { showToast("Error koneksi."); }
    }
  </script>
</body>
</html>
